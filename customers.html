h:54px;height:54px;flex-shrink:0;border-radius:50%;display:grid;place-items:center;background:#f8e2d5;font-size:27px}.person-main{flex:1;min-width:0}.name{font-size:17px;font-weight:750;overflow-wrap:anywhere}.meta{font-size:13px;color:var(--muted);margin-top:2px}.arrow{font-size:24px;color:#a99a89}.dots{display:flex;flex-wrap:wrap;gap:5px;margin:10px 0 12px}.hole{width:13px;height:13px;border-radius:50%;border:1.5px solid #d9cbbb;background:transparent}.hole.filled{border-color:var(--dot);background:var(--dot)}.hole.done{background:#edc16f;border-color:#edc16f}.actions{display:flex;gap:8px}.actions button:first-child{flex:1}.small{font-size:12px;padding:7px 10px;min-height:34px}.empty{color:var(--muted);font-size:13px;padding:16px 0;text-align:center}.sub{color:var(--muted);font-size:12px}.footer{text-align:center;color:var(--muted);font-size:11px;padding:12px}.formgrid{display:grid;grid-template-columns:1fr 140px;gap:9px}@media(max-width:390px){.formgrid{grid-template-columns:1fr}.person{padding:13px}}

<div class="card"><h2>新增顾客</h2><div class="formgrid"><div class="field" style="margin:0"><label for="newName">顾客姓名</label><input id="newName" placeholder="输入顾客姓名"></div><div class="field" style="margin:0"><label for="newType">季卡类型</label><select id="newType"><option value="11">11 天季卡</option><option value="30">30 天季卡</option></select></div></div><button id="add" class="primary full" style="margin-top:12px">＋ 新增顾客</button></div>
<div class="card"><div class="tabs"><button id="tabList" class="active">顾客列表</button><button id="tabVisits">到访记录</button></div><input class="search" id="search" placeholder="⌕ 搜索顾客姓名"><div id="list"></div><div id="visits" hidden></div></div><div class="footer">顾客季卡独立储存 · 与每日小记分开</div></div>
<script>
(()=>{const KEY='customer-cards-v1',OLD='daily-notebook-v1';const $=id=>document.getElementById(id);const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let cards=[],mode='list';function load(){try{cards=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{cards=[]}if(!Array.isArray(cards))cards=[];/* one-time migration from earlier combined version */try{const old=JSON.parse(localStorage.getItem(OLD)||'{}');if(old.customers&&old.customers.length){const ids=new Set(cards.map(x=>x.id));old.customers.forEach(c=>{if(!ids.has(c.id))cards.push(c)});delete old.customers;localStorage.setItem(OLD,JSON.stringify(old));localStorage.setItem(KEY,JSON.stringify(cards))}}catch{}cards.forEach(c=>{c.count=Number(c.count)||0;c.round=Number(c.round)||1;c.visits=Array.isArray(c.visits)?c.visits:[]})}function save(){localStorage.setItem(KEY,JSON.stringify(cards))}function dots(c){const max=Number(c.type),count=Number(c.count)||0;let out='';for(let i=1;i<=max;i++)out+=`<span class="hole ${i<=count?'filled':''}" style="--dot:${c.color||'#b78665'}"></span>`;return out}function render(){const q=$('search').value.trim().toLowerCase();$('list').hidden=mode!=='list';$('visits').hidden=mode!=='visits';if(mode==='list'){const shown=cards.filter(c=>c.name.toLowerCase().includes(q));$('list').innerHTML=shown.length?'':'<div class="empty">还没有顾客，先新增一张季卡吧。</div>';shown.forEach(c=>{const max=Number(c.type),count=Number(c.count)||0,done=count>=max,div=document.createElement('div');div.className='person';const emoji=c.avatar||['🐻','🐰','🐱','🐶','🐧'][cards.indexOf(c)%5];div.innerHTML=`<div class="person-top"><div class="avatar">${emoji}</div><div class="person-main"><div class="name"></div><div class="meta"></div><div class="meta roundline"></div></div><span class="arrow">›</span></div><div class="dots">${dots(c)}</div><div class="sub status"></div><div class="actions"><button class="primary visit"></button><button class="small edit">修改</button><button class="small del">删除</button></div>`;div.querySelector('.name').textContent=c.name;div.querySelector('.meta').textContent=max+' 天季卡';div.querySelector('.roundline').textContent=`第 ${c.round} 轮 · ${count}/${max} 次`;div.querySelector('.status').textContent=done?'本轮已完成；下一次到访将从第 1 次开始新一轮。':`还可记录 ${max-count} 次到访。`;div.querySelector('.visit').textContent=done?'开启新一轮 · 记录第 1 次':'记录到访 · 打一个洞';div.querySelector('.visit').onclick=()=>{if((Number(c.count)||0)>=max){c.count=1;c.round=(c.round||1)+1}else c.count=(Number(c.count)||0)+1;c.visits.push({date:today(),number:c.count,round:c.round});save();render()};div.querySelector('.edit').onclick=()=>{const name=prompt('顾客姓名：',c.name);if(name===null)return;const type=prompt('季卡天数（11 或 30）：',String(c.type));if(type===null)return;if(!name.trim()||!['11','30'].includes(type)){alert('请填写姓名，并输入 11 或 30。');return}c.name=name.trim();c.type=Number(type);if(c.count>c.type)c.count=0;save();render()};div.querySelector('.del').onclick=()=>{if(confirm(`确定删除「${c.name}」的季卡资料吗？`)){cards=cards.filter(x=>x.id!==c.id);save();render()}};$('list').appendChild(div)})}else{const visits=[];cards.forEach(c=>(c.visits||[]).forEach(v=>visits.push({...v,name:c.name,type:c.type})));visits.sort((a,b)=>b.date.localeCompare(a.date));$('visits').innerHTML=visits.length?visits.filter(v=>!q||v.name.toLowerCase().includes(q)).map(v=>`<div class="row between" style="padding:10px 0;border-bottom:1px solid var(--line)"><div><strong>${esc(v.name)}</strong><div class="sub">${v.round} 轮 · 第 ${v.number} 次 · ${v.type} 天季卡</div></div><span class="sub">${v.date}</span></div>`).join(''):'<div class="empty">暂时没有到访记录。</div>'}}$('add').onclick=()=>{const name=$('newName').value.trim();if(!name)return alert('请填写顾客姓名。');cards.push({id:uid(),name,type:Number($('newType').value),count:0,round:1,visits:[],color:['#bd8d6d','#91b8a0','#e2a69a','#e9b957','#92b8ca'][cards.length%5]});$('newName').value='';save();render()};$('newName').addEventListener('keydown',e=>{if(e.key==='Enter')$('add').click()});$('search').oninput=render;$('tabList').onclick=()=>{mode='list';$('tabList').classList.add('active');$('tabVisits').classList.remove('active');render()};$('tabVisits').onclick=()=>{mode='visits';$('tabVisits').classList.add('active');$('tabList').classList.remove('active');render()};$('settingsBtn').onclick=()=>{const blob=new Blob([JSON.stringify({app:'顾客季卡',version:1,exportedAt:new Date().toISOString(),customers:cards},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='顾客季卡备份-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};load();render();})();
</script></body></html>
